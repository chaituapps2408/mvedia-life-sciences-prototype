<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mvedia Life Sciences — Doctor Ordering App Prototype</title>
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mvedia Direct" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #F1F4F6;
      --content: #F6F8FA;
      --card: #FFFFFF;
      --card-border: #E6ECF0;
      --border: #D7E0E6;
      --foreground: #0F172A;
      --muted-foreground: #5B6B7C;
      --primary: #0F766E;
      --primary-foreground: #FFFFFF;
      --success: #059669;
      --warning: #D97706;
      --error: #DC2626;
    }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--background);
      color: var(--foreground);
      font-size: 14px;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes slideInRight {
      from { transform: translateX(22px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes popCheck {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes drawStroke {
      from { stroke-dashoffset: var(--dash-len, 240); opacity: 0.2; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes leafBloom {
      0% { transform: scale(0.4) translateY(6px); opacity: 0; }
      70% { transform: scale(1.06) translateY(0); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes haloBreath {
      0% { transform: scale(0.92); opacity: 0.35; }
      50% { transform: scale(1.12); opacity: 0.08; }
      100% { transform: scale(0.92); opacity: 0.35; }
    }
    @keyframes orbitSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .anim-push { animation: slideInRight 220ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .anim-fade-up { animation: fadeUp 240ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .anim-check { animation: popCheck 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .anim-sheet { animation: sheetUp 260ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    .logo-ring-draw {
      stroke-dasharray: 290;
      stroke-dashoffset: 290;
      --dash-len: 290;
      animation: drawStroke 1100ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .logo-m-draw {
      stroke-dasharray: 180;
      stroke-dashoffset: 180;
      --dash-len: 180;
      animation: drawStroke 950ms cubic-bezier(0.22, 1, 0.36, 1) 180ms forwards;
    }
    .logo-leaf {
      transform-origin: 60px 44px;
      opacity: 0;
      animation: leafBloom 680ms cubic-bezier(0.22, 1, 0.36, 1) 620ms forwards;
    }
    .logo-halo {
      transform-origin: 60px 60px;
      animation: haloBreath 4.2s ease-in-out infinite;
    }
    .logo-halo-2 {
      transform-origin: 60px 60px;
      animation: haloBreath 4.2s ease-in-out 1.4s infinite;
    }
    .logo-orbit {
      transform-origin: 60px 60px;
      animation: orbitSlow 16s linear infinite;
    }
    .logo-float {
      animation: floatSoft 5s ease-in-out infinite;
    }
    .brand-reveal-1 {
      opacity: 0;
      animation: fadeUp 520ms cubic-bezier(0.22, 1, 0.36, 1) 350ms forwards;
    }
    .brand-reveal-2 {
      opacity: 0;
      animation: fadeUp 520ms cubic-bezier(0.22, 1, 0.36, 1) 520ms forwards;
    }
    .brand-reveal-3 {
      opacity: 0;
      animation: fadeUp 520ms cubic-bezier(0.22, 1, 0.36, 1) 680ms forwards;
    }

    .press {
      transition: transform 120ms ease, opacity 120ms ease, background-color 150ms ease;
    }
    .press:active {
      transform: scale(0.975);
      opacity: 0.92;
    }

    .glass-bar {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .product-photo {
      aspect-ratio: 4 / 3;
      width: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-0">
  <div class="min-h-[100dvh] flex flex-col items-center p-0 sm:py-6 sm:px-3">

    <!-- Minimal Prototype Control Bar -->
    <div class="w-full sm:max-w-[400px] px-3 py-2 sm:p-0 sm:mb-3.5 bg-[var(--background)] border-b border-[var(--card-border)] sm:border-0 flex items-center justify-between gap-2 shrink-0">
      <div class="flex p-1 rounded-full bg-[var(--card)] border border-[var(--border)]">
        <button id="btn-role-doctor" onclick="switchRole('doctor')" class="press px-3.5 py-1.5 rounded-full text-xs font-semibold cursor-pointer">
          Doctor App
        </button>
        <button id="btn-role-owner" onclick="switchRole('owner')" class="press px-3.5 py-1.5 rounded-full text-xs font-semibold cursor-pointer">
          Owner Delivery
        </button>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="resetToLanding()" title="Restart from Welcome Screen" class="press px-2.5 py-1.5 rounded-full text-xs font-medium bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)] cursor-pointer">
          Welcome
        </button>
        <button onclick="openEmailDrawer()" class="press inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)] cursor-pointer">
          <svg class="w-3.5 h-3.5 text-[var(--primary)]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <span id="email-badge" class="min-w-[18px] h-[18px] px-1 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold inline-flex items-center justify-center leading-none">2</span>
        </button>
      </div>
    </div>

    <!-- Native Mobile Viewport -->
    <div class="relative w-full flex-1 sm:flex-none sm:max-w-[396px] h-[calc(100dvh-52px)] sm:h-[790px] sm:rounded-[36px] bg-[var(--content)] sm:border sm:border-[var(--border)] sm:shadow-2xl overflow-hidden flex flex-col">

      <!-- Native Status Bar -->
      <div class="hidden sm:flex shrink-0 h-8 px-6 bg-[var(--card)] items-center justify-between text-xs font-semibold text-[var(--foreground)] select-none z-30">
        <span class="tabular-nums">9:41</span>
        <div class="w-20 h-4 rounded-full bg-[var(--content)] border border-[var(--card-border)]"></div>
        <div class="flex items-center gap-1.5 text-[var(--foreground)]">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M2 18h2v-4H2v4zm4 0h2v-7H6v7zm4 0h2V8h-2v10zm4 0h2V5h-2v13zm4 0h2V2h-2v16z"/></svg>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2" stroke-linecap="round"/><rect x="4.5" y="9.5" width="11" height="5" rx="0.8" fill="currentColor" stroke="none"/></svg>
        </div>
      </div>

      <!-- Subtle Native Toast -->
      <div id="toast" class="hidden absolute top-11 left-1/2 -translate-x-1/2 z-50 max-w-[340px] w-[88%] px-4 py-2.5 rounded-2xl bg-[var(--foreground)] text-[var(--background)] shadow-xl text-xs font-medium flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[var(--success)] shrink-0"></span>
        <span id="toast-msg" class="leading-snug"></span>
      </div>

      <!-- Dynamic App Viewport -->
      <div id="app-root" class="flex-1 flex flex-col overflow-hidden relative"></div>

      <!-- Native Bottom Sheet Modal -->
      <div id="sheet-bg" onclick="closeSheet()" class="hidden absolute inset-0 bg-black/45 z-40"></div>
      <div id="sheet-box" class="hidden absolute bottom-0 left-0 right-0 max-h-[82%] rounded-t-[28px] bg-[var(--card)] border-t border-[var(--border)] z-50 flex flex-col overflow-hidden anim-sheet shadow-2xl">
        <div class="pt-3 pb-1 flex justify-center cursor-pointer shrink-0" onclick="closeSheet()">
          <div class="w-10 h-1 rounded-full bg-[var(--border)]"></div>
        </div>
        <div id="sheet-inner" class="flex-1 overflow-y-auto no-scrollbar px-5 pb-7 pt-2"></div>
      </div>

    </div>

    <p class="hidden sm:block mt-3 text-xs text-[var(--muted-foreground)] text-center max-w-[380px] leading-relaxed">
      Try <strong>Sign In</strong>, <strong>Create Account</strong>, or <strong>Continue as Guest</strong> — place an order immediately, then switch to <strong>Owner Delivery</strong> to send the GST invoice &amp; collect cash.
    </p>
  </div>

  <!-- Simulated Email Inbox Drawer -->
  <div id="email-drawer" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
    <div class="w-full max-w-[520px] max-h-[84vh] rounded-3xl bg-[var(--card)] border border-[var(--border)] shadow-2xl flex flex-col overflow-hidden">
      <div class="px-5 py-4 border-b border-[var(--card-border)] flex items-center justify-between">
        <div>
          <h2 class="text-sm font-bold text-[var(--foreground)]">Automatic Email Activity</h2>
          <p class="text-xs text-[var(--muted-foreground)] mt-0.5">Triggered automatically via Amazon SES across onboarding &amp; orders</p>
        </div>
        <button onclick="closeEmailDrawer()" class="press w-8 h-8 rounded-full bg-[var(--content)] flex items-center justify-center text-[var(--muted-foreground)] cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="email-drawer-list" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[var(--content)]"></div>
    </div>
  </div>

            name: `${m.name} ${m.strength}`,
            qty,
            bonus,
            price: m.price,
            hsn: m.hsn,
            batch: m.batch,
            expiry: m.expiry
          });
        }
      }
      const gst = Math.round(subtotal * 0.12);
      return { boxes, freeBoxes, subtotal, gst, total: subtotal + gst, items };
    }

    let toastTimer;
    function toast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function pushEmail(to, tag, subject, body, attachment = null) {
      state.emails.unshift({ to, tag, subject, time: 'Just now', body, attachment });
      document.getElementById('email-badge').textContent = state.emails.length;
    }

    // ============================================================
    // AUTH & JOURNEY ACTIONS
    // ============================================================
    function resetToLanding() {
      state.role = 'doctor';
      state.authMode = 'none';
      state.currentUser = null;
      state.cart = {};
      state.signInStep = 'phone';
      state.signUpStep = 1;
      state.doctorView = 'landing';
      closeSheet();
      render();
    }

    function continueAsGuest() {
      state.authMode = 'guest';
      state.currentUser = null;
      state.cart = {};
      state.doctorView = 'home';
      render();
      toast('Browsing as Guest — inspect any formulation freely');
    }

    function startSignIn() {
      state.signInStep = 'phone';
      state.doctorView = 'signin';
      closeSheet();
      render();
    }

    function sendSignInOtp() {
      state.signInStep = 'otp';
      render();
      toast(`OTP sent to ${state.signInPhone}`);
    }

    function verifySignInOtp() {
      state.authMode = 'verified';
      state.currentUser = { ...DEMO_DOCTOR };
      state.doctorView = 'home';
      render();
      toast(`Welcome back, ${DEMO_DOCTOR.firstName}!`);
    }

    function startSignUp() {
      state.signUpStep = 1;
      state.doctorView = 'signup';
      closeSheet();
      render();
    }

    function submitSignUp() {
      const f = state.signUpForm;
      const newId = 'doc-' + Date.now();
      const firstName = (f.name.trim() || 'Dr. Meera Joshi').split(' ').slice(0, 2).join(' ');
      state.currentUser = {
        id: newId,
        name: f.name.trim() || 'Dr. Meera Joshi',
        firstName,
        type: f.type,
        qualification: f.type === 'Doctor' ? 'Doctor / Clinic' : 'Pharmacy',
        clinic: f.clinic.trim() || 'Clinic',
        address: f.address.trim() || 'Pune',
        phone: f.phone.trim(),
        email: f.email.trim(),
        regNo: '',
        gstin: f.gstin.trim() || ''
      };
      state.authMode = 'verified';

      state.pendingDoctors.unshift({
        id: newId,
        name: state.currentUser.name,
        clinic: state.currentUser.clinic,
        phone: state.currentUser.phone,
        email: state.currentUser.email,
        type: state.currentUser.type,
        status: 'approved'
      });

      pushEmail(
        state.currentUser.email,
        'To Doctor',
        `Welcome to Mvedia Life Sciences`,
        `Hello ${state.currentUser.name}, your account for ${state.currentUser.clinic} is ready. You can browse all formulations and place direct clinic orders anytime.`
      );

      state.doctorView = 'home';
      render();
      toast(`Welcome, ${firstName}! You're ready to order.`);
    }

    function switchRole(role) {
      state.role = role;
      closeSheet();
      if (role === 'owner' && !['deliveries', 'cashbook', 'doctors', 'assistant'].includes(state.ownerView)) {
        state.ownerView = 'deliveries';
      }
      render();
    }

    function goDoctor(view, param = null) {
      closeSheet();
      if (view === 'detail') {
        state.selectedMedId = param;
        state.detailQty = state.cart[param] || 1;
      } else if (view === 'invoice') {
        state.invoiceOrderId = param;
      }
      state.doctorView = view;
      render();
    }

    function goOwner(view, param = null) {
      closeSheet();
      if (view === 'owner-invoice' || view === 'owner-collect') {
        state.activeOwnerOrderId = param;
      } else if (view === 'invoice') {
        state.invoiceOrderId = param;
      }
      state.ownerView = view;
      render();
    }

    function quickAdd(medId, delta) {
      const next = Math.max(0, (state.cart[medId] || 0) + delta);
      if (next === 0) delete state.cart[medId];
      else state.cart[medId] = next;
      render();
    }

    function setDetailQty(qty) {
      state.detailQty = Math.max(1, qty);
      render();
    }

    function commitDetailToCart() {
      const med = MEDICINES.find(m => m.id === state.selectedMedId);
      state.cart[med.id] = state.detailQty;
      state.doctorView = 'home';
      render();
      const bonus = state.detailQty >= med.schemeMin ? Math.floor(state.detailQty / med.schemeMin) * med.schemeBonus : 0;
      toast(`Added ${state.detailQty} box${state.detailQty > 1 ? 'es' : ''}${bonus ? ` (+${bonus} free)` : ''} of ${med.name}`);
    }

    function placeOrder() {
      const cart = getCart();
      if (cart.items.length === 0) return;
      const doc = activeDoctor();

      const orderId = 'ORD-' + (1042 + state.orders.length - 1);
      if (state.authMode === 'guest') {
        const f = state.signUpForm;
        state.currentUser = {
          id: 'guest-' + Date.now(),
          name: f.name.trim() || 'Dr. Meera Joshi',
          firstName: (f.name.trim() || 'Dr. Meera Joshi').split(' ').slice(0, 2).join(' '),
          type: f.type,
          qualification: 'Clinic Account',
          clinic: f.clinic.trim() || 'Clinic',
          address: f.address.trim() || 'Pune',
          phone: f.phone.trim(),
          email: f.email.trim(),
          regNo: '',
          gstin: ''
        };
      }
      const buyer = activeDoctor();
      const newOrder = {
        id: orderId,
        createdAt: 'Just now',
        doctorName: buyer.name,
        clinic: buyer.clinic,
        address: buyer.address,
        phone: buyer.phone,
        email: buyer.email,
        regNo: buyer.regNo || '',
        gstin: buyer.gstin || '',
        deliverySlot: state.deliverySlot,
        note: state.deliveryNote.trim(),
        status: 'placed',
        items: cart.items,
        invoiceNo: null,
        invoicedAt: null,
        paymentMethod: null,
        paidAt: null
      };

      state.orders.unshift(newOrder);
      state.cart = {};
      state.deliveryNote = '';
      state.confirmedOrderId = orderId;
      state.doctorView = 'confirmed';

      const summaryText = newOrder.items.map(i => `${i.qty}${i.bonus ? ` (+${i.bonus} free)` : ''} ${i.name}`).join(', ');
      pushEmail(
        buyer.email,
        'To Doctor',
        `Order Confirmed ${orderId} · Mvedia Life Sciences (${inr(cart.total)})`,
        `Dear ${buyer.name}, we received your order ${orderId} for ${summaryText}. Total payable on personal delivery: ${inr(cart.total)} (incl. 12% GST). Scheduled slot: ${newOrder.deliverySlot}.`
      );
      pushEmail(
        OWNER.email,
        'To Owner',
        `New Clinic Order ${orderId} · ${buyer.name} (${inr(cart.total)})`,
        `Deliver to: ${buyer.clinic}, ${buyer.address}. Items: ${summaryText}. Slot: ${newOrder.deliverySlot}. ${newOrder.note ? 'Doctor note: "' + newOrder.note + '"' : ''}`
      );

      render();
    }

    function reorder(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;
      state.cart = {};
      order.items.forEach(i => { state.cart[i.medId] = i.qty; });
      state.doctorView = 'checkout';
      render();
      toast(`Loaded ${order.id} items for quick reorder`);
    }

    function submitOwnerInvoice(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      order.items.forEach((it, idx) => {
        const b = document.getElementById(`b-${idx}`);
        const e = document.getElementById(`e-${idx}`);
        if (b && b.value.trim()) it.batch = b.value.trim();
        if (e && e.value.trim()) it.expiry = e.value.trim();
      });

      const invNo = 'INV-2627-0' + (104 + state.orders.length);
      order.invoiceNo = invNo;
      order.invoicedAt = 'Just now';
      order.status = 'invoiced';

      const totals = calcTotals(order.items);
      pushEmail(
        order.email,
        'To Doctor',
        `GST Tax Invoice ${invNo} — Order ${order.id} (${inr(totals.total)})`,
        `Dear ${order.doctorName}, your order ${order.id} is ready for personal delivery. Attached is GST Invoice ${invNo} with batch and expiry details. Amount payable on delivery: ${inr(totals.total)}.`,
        `${invNo}.pdf`
      );

      state.ownerView = 'owner-collect';
      state.activeOwnerOrderId = order.id;
      render();
      toast(`GST Invoice ${invNo} emailed to ${order.doctorName}`);
    }

    function completeCashCollection(orderId, method) {
      const order = state.orders.find(o => o.id === orderId);
      order.status = 'delivered';
      order.paymentMethod = method;
      order.paidAt = 'Just now';

      const totals = calcTotals(order.items);
      pushEmail(
        order.email,
        'To Doctor',
        `Payment Receipt (${method}) · ${order.invoiceNo}`,
        `Dear ${order.doctorName}, thank you! We received ${inr(totals.total)} via ${method} for Order ${order.id}. Your paid GST Tax Invoice is attached for your records.`,
        `${order.invoiceNo}-PAID.pdf`
      );

      state.ownerView = 'deliveries';
      render();
      toast(`Payment (${method}) recorded & receipt emailed`);
    }

    function requestSample(medId) {
      const med = MEDICINES.find(m => m.id === medId);
      const doc = activeDoctor();
      if (!state.sampleRequests.includes(med.name)) {
        state.sampleRequests.unshift(med.name);
      }
      pushEmail(
        OWNER.email,
        'To Owner',
        `Physician Sample Request: ${med.name} — ${doc.name}`,
        `${doc.name} (${doc.clinic}) requested physician samples of ${med.name} (${med.composition}). Bring along on your next clinic visit.`
      );
      closeSheet();
      toast(`Sample requested for ${med.name}`);
    }

    function approveBuyer(id) {
      const buyer = state.pendingDoctors.find(d => d.id === id);
      if (!buyer) return;
      buyer.status = 'approved';

      // If this was the currently signed-up user, unlock their account immediately!
      if (state.currentUser && state.currentUser.id === id) {
        state.authMode = 'verified';
      }

      pushEmail(
        buyer.email || `${buyer.name.toLowerCase().replace(/[^a-z]/g, '')}@clinic.in`,
        'To Buyer',
        `Account Verified — Welcome to Mvedia Life Sciences`,
        `Hello ${buyer.name}, your license (${buyer.regNo}) has been verified by ${OWNER.name}. Doctor pricing and direct ordering are now unlocked.`
      );
      render();
      toast(`${buyer.name} approved! Pricing unlocked.`);
    }

    function render() {
      const bDoc = document.getElementById('btn-role-doctor');
      const bOwn = document.getElementById('btn-role-owner');
      if (state.role === 'doctor') {
        bDoc.className = 'press px-3.5 py-1.5 rounded-full text-xs font-semibold cursor-pointer bg-[var(--primary)] text-[var(--primary-foreground)]';
        bOwn.className = 'press px-3.5 py-1.5 rounded-full text-xs font-semibold cursor-pointer text-[var(--muted-foreground)]';
      } else {
        bOwn.className = 'press px-3.5 py-1.5 rounded-full text-xs font-semibold cursor-pointer bg-[var(--primary)] text-[var(--primary-foreground)]';
        bDoc.className = 'press px-3.5 py-1.5 rounded-full text-xs font-semibold cursor-pointer text-[var(--muted-foreground)]';
      }

      const root = document.getElementById('app-root');
      if (state.role === 'doctor') {
        if (state.doctorView === 'landing') root.innerHTML = viewLanding();
        else if (state.doctorView === 'signin') root.innerHTML = viewSignIn();
        else if (state.doctorView === 'signup') root.innerHTML = viewSignUp();
        else if (state.doctorView === 'signup-done') root.innerHTML = viewSignUpDone();
        else if (state.doctorView === 'home') root.innerHTML = viewDoctorHome();
        else if (state.doctorView === 'detail') root.innerHTML = viewMedicineDetail();
        else if (state.doctorView === 'checkout') root.innerHTML = viewDoctorCheckout();
        else if (state.doctorView === 'confirmed') root.innerHTML = viewOrderConfirmed();
        else if (state.doctorView === 'orders') root.innerHTML = viewDoctorOrders();
        else if (state.doctorView === 'invoice') root.innerHTML = viewInvoiceScreen('doctor');
        else root.innerHTML = viewDoctorClinic();
      } else {
        if (state.ownerView === 'deliveries') root.innerHTML = viewOwnerDeliveries();
        else if (state.ownerView === 'owner-invoice') root.innerHTML = viewOwnerPrepareInvoice();
        else if (state.ownerView === 'owner-collect') root.innerHTML = viewOwnerCollectPayment();
        else if (state.ownerView === 'invoice') root.innerHTML = viewInvoiceScreen('owner');
        else if (state.ownerView === 'cashbook') root.innerHTML = viewOwnerCashbook();
        else if (state.ownerView === 'assistant') root.innerHTML = viewOwnerAssistant();
        else root.innerHTML = viewOwnerDoctors();
      }

      document.getElementById('email-badge').textContent = state.emails.length;
      const chatScroll = document.getElementById('ai-chat-scroll');
      if (chatScroll) chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function getUpcomingDays(count = 5) {
      const days = [];
      const now = new Date();
      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      for (let i = 0; i < count; i++) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        days.push({
          iso,
          top: i === 0 ? 'Today' : i === 1 ? 'Tmrw' : weekdays[d.getDay()],
          num: d.getDate(),
          mon: months[d.getMonth()],
          label: i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : `${weekdays[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`
        });
      }
      return days;
    }

    function formatIsoDateLabel(iso) {
      const days = getUpcomingDays(2);
      const match = days.find(d => d.iso === iso);
      if (match) return match.label;
      const parts = iso.split('-').map(Number);
      if (parts.length !== 3) return iso;
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${weekdays[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
    }

    function setDeliveryDate(iso) {
      if (!iso) return;
      state.deliveryDate = iso;
      state.deliverySlot = `${formatIsoDateLabel(iso)} · ${state.deliveryTimeSlot}`;
      render();
    }

    function setDeliveryTimeSlot(slotTime) {
      state.deliveryTimeSlot = slotTime;
      state.deliverySlot = `${formatIsoDateLabel(state.deliveryDate)} · ${slotTime}`;
      render();
    }

    function viewDoctorCheckout() {
      const cart = getCart();
      const doc = activeDoctor();
      const upcomingDays = getUpcomingDays(5);
      const minIso = upcomingDays[0].iso;
      if (!state.deliveryDate || state.deliveryDate < minIso) {
        state.deliveryDate = minIso;

      state.deliverySlot = `${formatIsoDateLabel(state.deliveryDate)} · ${state.deliveryTimeSlot}`;

      const timeSlots = [
        { label: 'Morning', time: '9:30 AM – 12:00 PM' },
        { label: 'Afternoon', time: '12:00 PM – 3:00 PM' },

            <h2 class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Your Order</h2>
            <div class="rounded-2xl bg-[var(--card)] border border-[var(--card-border)] divide-y divide-[var(--card-border)]">
              ${cart.items.map(it => `
                <div class="p-3.5 flex items-center justify-between gap-3">
                  <div class="min-w-0">
                    <div class="text-sm font-semibold text-[var(--foreground)] truncate">${it.name}</div>
                    <div class="text-xs text-[var(--muted-foreground)] mt-0.5">
                      ${it.qty} × ${inr(it.price)}
                      ${it.bonus ? `<span class="text-[var(--success)] font-semibold"> · +${it.bonus} free</span>` : ''}
                    </div>
                  </div>
                  <div class="text-sm font-bold text-[var(--foreground)] tabular-nums shrink-0">${inr(it.qty * it.price)}</div>
                </div>
              `).join('')}
              <div class="p-3.5 space-y-1.5 text-xs bg-[var(--content)]/40">
                <div class="flex justify-between text-[var(--muted-foreground)]"><span>Subtotal</span><span class="tabular-nums">${inr(cart.subtotal)}</span></div>
                <div class="flex justify-between text-[var(--muted-foreground)]"><span>GST (12%)</span><span class="tabular-nums">${inr(cart.gst)}</span></div>
                <div class="flex justify-between text-sm font-bold text-[var(--foreground)] pt-1.5"><span>Payable on Delivery</span><span class="tabular-nums">${inr(cart.total)}</span></div>
              </div>
            </div>
          </section>

          <!-- Delivery Date Picker -->
          <section class="space-y-2.5">
            <div class="flex items-center justify-between">
              <h2 class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Delivery Date</h2>
              <span class="text-xs font-semibold text-[var(--primary)]">${formatIsoDateLabel(state.deliveryDate)}</span>
            </div>

            <!-- Quick 5-Day Native Chips -->
            <div class="grid grid-cols-5 gap-1.5">
              ${upcomingDays.map(d => {
                const active = state.deliveryDate === d.iso;
                return `
                  <button onclick="setDeliveryDate('${d.iso}')" class="press py-2.5 px-1 rounded-2xl border text-center cursor-pointer ${active ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)] shadow-sm' : 'bg-[var(--card)] text-[var(--foreground)] border-[var(--card-border)]'}">
                    <div class="text-[11px] font-medium ${active ? 'opacity-90' : 'text-[var(--muted-foreground)]'}">${d.top}</div>
                    <div class="text-sm font-bold tabular-nums leading-tight mt-0.5">${d.num}</div>
                    <div class="text-[11px] ${active ? 'opacity-85' : 'text-[var(--muted-foreground)]'}">${d.mon}</div>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Calendar Date Picker for Any Other Future Date -->
            <label class="flex items-center justify-between px-3.5 py-2.5 rounded-2xl bg-[var(--card)] border border-[var(--card-border)] text-xs cursor-pointer">
              <span class="text-[var(--muted-foreground)] font-medium">Or pick another date</span>
              <input
                type="date"
                min="${minIso}"
                value="${state.deliveryDate}"
                onchange="setDeliveryDate(this.value)"
                class="bg-transparent text-xs font-semibold text-[var(--foreground)] outline-none cursor-pointer"
              />
            </label>
          </section>

          <!-- Preferred Time Slot Picker -->
          <section class="space-y-2.5">
            <h2 class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Preferred Time Slot</h2>
            <div class="grid grid-cols-2 gap-2">
              ${timeSlots.map(s => {
                const selected = state.deliveryTimeSlot === s.time;
                return `
                  <button onclick="setDeliveryTimeSlot('${s.time}')" class="press p-3 rounded-2xl border text-left cursor-pointer ${selected ? 'bg-[var(--card)] border-[var(--primary)] shadow-sm' : 'bg-[var(--card)]/70 border-[var(--card-border)]'}">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-bold ${selected ? 'text-[var(--primary)]' : 'text-[var(--foreground)]'}">${s.label}</span>
                      <span class="w-4 h-4 rounded-full border-2 flex items-center justify-center ${selected ? 'border-[var(--primary)]' : 'border-[var(--border)]'}">
                        ${selected ? `<span class="w-2 h-2 rounded-full bg-[var(--primary)]"></span>` : ''}
                      </span>
                    </div>
                    <div class="text-xs text-[var(--muted-foreground)] mt-1 tabular-nums">${s.time}</div>
                  </button>
                `;
              }).join('')}
            </div>
          </section>

          <section class="space-y-2.5">
            <div class="flex items-center justify-between">
              <h2 class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Deliver To</h2>

    function submitAssistantInput(e) {
      e.preventDefault();
      const text = state.aiDraft.trim();
      if (!text || state.aiThinking) return;
      state.aiDraft = '';
      askAssistant(text);
    }

    function askAssistant(promptText) {
      if (state.aiThinking) return;
      state.aiMessages.push({ sender: 'user', text: promptText, time: 'Just now' });
      state.aiThinking = true;
      render();

      setTimeout(() => {
        const reply = generateAssistantReply(promptText);
        state.aiThinking = false;
        state.aiMessages.push({
          sender: 'ai',
          time: 'Just now · Live DB',
          title: reply.title,
          html: reply.html
        });
        render();
      }, 360);
    }

    function generateAssistantReply(rawPrompt) {
      const q = rawPrompt.toLowerCase();
      const openOrders = state.orders.filter(o => o.status !== 'delivered');
      const deliveredOrders = state.orders.filter(o => o.status === 'delivered');

      let cashTotal = 0, upiTotal = 0, pendingTotal = 0;
      for (const o of state.orders) {
        const t = calcTotals(o.items).total;
        if (o.status === 'delivered') {
          if (o.paymentMethod === 'UPI') upiTotal += t;
          else cashTotal += t;
        } else {
          pendingTotal += t;
        }
      }
      const collectedTotal = cashTotal + upiTotal;

      // 1. Pending deliveries
      if (q.includes('pending') || q.includes('deliver') || q.includes('open') || q.includes('left')) {
        if (openOrders.length === 0) {
          return {
            title: 'No Pending Deliveries',
            html: `<p>All <strong>${deliveredOrders.length}</strong> orders have been delivered and paid (<strong>${inr(collectedTotal)}</strong> collected).</p><p class="text-[var(--muted-foreground)]">Place a new test order in <strong>Doctor App</strong> and ask me again to see live updates.</p>`
          };
        }
        return {
          title: `${openOrders.length} Pending ${openOrders.length === 1 ? 'Delivery' : 'Deliveries'} (${inr(pendingTotal)})`,
          html: openOrders.map(o => {
            const t = calcTotals(o.items).total;
            const stage = o.status === 'placed' ? 'Needs GST Invoice' : `Invoiced (${o.invoiceNo}) · Collect COD`;
            return `<div class="p-2.5 rounded-xl bg-[var(--content)] space-y-0.5"><div class="flex justify-between font-semibold"><span>${o.id} · ${o.doctorName}</span><span>${inr(t)}</span></div><div class="text-[var(--muted-foreground)]">${o.clinic} · ${o.deliverySlot}</div><div class="text-[var(--primary)] font-medium">${stage}</div></div>`;
          }).join('')
        };
      }

      // 2. Cash / Money / UPI / Collection
      if (q.includes('cash') || q.includes('upi') || q.includes('money') || q.includes('collect') || q.includes('paid') || q.includes('revenue')) {
        return {
          title: `Collections Summary · ${inr(collectedTotal)}`,
          html: `
            <div class="grid grid-cols-2 gap-2">
              <div class="p-2.5 rounded-xl bg-[var(--content)]"><div class="text-[var(--muted-foreground)]">Cash in Hand</div><div class="text-sm font-bold text-[var(--success)]">${inr(cashTotal)}</div></div>
              <div class="p-2.5 rounded-xl bg-[var(--content)]"><div class="text-[var(--muted-foreground)]">UPI Received</div><div class="text-sm font-bold">${inr(upiTotal)}</div></div>
            </div>
            <p class="pt-1">Paid orders: <strong>${deliveredOrders.length}</strong>. Pending to collect on open deliveries: <strong class="text-[var(--warning)]">${inr(pendingTotal)}</strong>.</p>
          `
        };
      }

      // 3. Top selling medicine / products
      if (q.includes('medicine') || q.includes('product') || q.includes('top') || q.includes('selling') || q.includes('stock')) {
        const counts = {};
        for (const o of state.orders) {
          for (const it of o.items) {
            counts[it.name] = (counts[it.name] || 0) + it.qty;
          }
        }
        const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        return {
          title: 'Top Ordered Formulations',
          html: ranked.map(([name, qty], i) => `
            <div class="flex justify-between py-1 ${i > 0 ? 'border-t border-[var(--card-border)]' : ''}">
              <span class="font-medium">${i + 1}. ${name}</span>
              <span class="font-bold tabular-nums">${qty} boxes</span>
            </div>
          `).join('')
        };
      }

      // 4. Follow-up / Doctors / Samples
      if (q.includes('follow') || q.includes('doctor') || q.includes('clinic') || q.includes('sample') || q.includes('remind')) {
        const sampleLine = state.sampleRequests.length > 0
          ? `<p><strong>Sample Requests:</strong> Bring samples of ${state.sampleRequests.join(', ')} on your next clinic visit.</p>`
          : '';
        return {
          title: 'Recommended Clinic Follow-Ups',
          html: `
            ${sampleLine}
            <div class="p-2.5 rounded-xl bg-[var(--content)] space-y-1">
              <div class="font-semibold">Dr. Vikram Kulkarni · Kulkarni Care Polyclinic</div>
              <div class="text-[var(--muted-foreground)]">Hasn't placed an order yet this month — good candidate for a CardioVeda AM sample visit.</div>
            </div>
            <div class="p-2.5 rounded-xl bg-[var(--content)] space-y-1">
              <div class="font-semibold">Arogya Plus Medicals · Aundh</div>
              <div class="text-[var(--muted-foreground)]">Usually stocks 10+2 GlucoShield M2 scheme at month-end.</div>
            </div>
          `
        };
      }

      // 5. Default / Today's Daily Summary
      return {
        title: `Mvedia Daily Briefing`,
        html: `
          <div class="grid grid-cols-2 gap-2">
            <div class="p-2.5 rounded-xl bg-[var(--content)]"><div class="text-[var(--muted-foreground)]">Collected</div><div class="text-sm font-bold text-[var(--success)]">${inr(collectedTotal)}</div><div class="text-[11px] text-[var(--muted-foreground)]">Cash ${inr(cashTotal)} · UPI ${inr(upiTotal)}</div></div>
            <div class="p-2.5 rounded-xl bg-[var(--content)]"><div class="text-[var(--muted-foreground)]">Pending COD</div><div class="text-sm font-bold text-[var(--warning)]">${inr(pendingTotal)}</div><div class="text-[11px] text-[var(--muted-foreground)]">${openOrders.length} open ${openOrders.length === 1 ? 'order' : 'orders'}</div></div>
          </div>
          <p class="pt-1"><strong>Delivered:</strong> ${deliveredOrders.length} order${deliveredOrders.length === 1 ? '' : 's'} completed. ${openOrders.length > 0 ? `Next delivery: <strong>${openOrders[0].doctorName}</strong> (${openOrders[0].deliverySlot}).` : 'All scheduled clinic deliveries are complete!'}</p>
        `
      };
    }

    function renderOwnerBottomNav(active) {
      const openDeliveries = state.orders.filter(o => o.status !== 'delivered').length;
      const tab = (id, label, icon, badge = 0) => `
        <button onclick="goOwner('${id}')" class="press flex flex-col items-center justify-center py-1.5 cursor-pointer ${active === id ? 'text-[var(--primary)] font-semibold' : 'text-[var(--muted-foreground)] font-medium'}">
          <div class="relative">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="${active === id ? '2.2' : '1.7'}" viewBox="0 0 24 24">${icon}</svg>
            ${badge > 0 ? `<span class="absolute -top-1 -right-2 min-w-[15px] h-[15px] px-1 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-[10px] font-bold flex items-center justify-center">${badge}</span>` : ''}
          </div>
          <span class="text-xs mt-1 leading-none">${label}</span>
        </button>
      `;
      return `
        <nav class="shrink-0 bg-[var(--card)]/95 glass-bar border-t border-[var(--card-border)] px-2 pt-1.5 pb-3 grid grid-cols-4 z-20">
          ${tab('deliveries', 'Deliveries', `<path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>`, openDeliveries)}
          ${tab('cashbook', 'Cashbook', `<path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>`)}
          ${tab('doctors', 'Clinics', `<path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>`)}
          ${tab('assistant', 'AI Chat', `<path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>`)}
        </nav>
      `;
    }

    // ============================================================
    // BOTTOM SHEETS
    // ============================================================
    function openSheet(html) {
      document.getElementById('sheet-inner').innerHTML = html;
      document.getElementById('sheet-bg').classList.remove('hidden');
      document.getElementById('sheet-box').classList.remove('hidden');
    }

    function closeSheet() {
      document.getElementById('sheet-bg').classList.add('hidden');
      document.getElementById('sheet-box').classList.add('hidden');
    }

    function openSampleConfirm(medId) {
      const med = MEDICINES.find(m => m.id === medId);
      const doc = activeDoctor();
      openSheet(`
        <div class="space-y-4">
          <div class="flex items-center gap-3">
            <img src="${med.image}" alt="${med.name}" class="w-16 h-12 rounded-xl object-cover" />
            <div>
              <h3 class="text-sm font-bold text-[var(--foreground)]">Request Physician Sample</h3>
              <p class="text-xs text-[var(--muted-foreground)]">${med.name} ${med.strength}</p>
            </div>
          </div>
          <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">
            We'll notify ${OWNER.name} to bring complimentary clinical sample strips to <strong>${doc.clinic}</strong> on the next visit.
          </p>
          <button onclick="requestSample('${med.id}')" class="press w-full py-3 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold cursor-pointer">
            Confirm Sample Request
          </button>
        </div>
      `);
    }

    function openEmailDrawer() {
      document.getElementById('email-drawer-list').innerHTML = state.emails.map(em => `
        <div class="rounded-2xl bg-[var(--card)] border border-[var(--card-border)] p-4 space-y-1.5 text-xs">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-[var(--primary)]">${em.tag}</span>
            <span class="text-[var(--muted-foreground)]">${em.time}</span>
          </div>
          <div class="text-sm font-bold text-[var(--foreground)]">${em.subject}</div>
          <div class="font-mono text-[var(--muted-foreground)]">To: ${em.to}</div>
          <p class="text-[var(--foreground)] leading-relaxed pt-1">${em.body}</p>
          ${em.attachment ? `<div class="pt-1"><span class="inline-block px-2.5 py-1 rounded-lg bg-[var(--content)] border border-[var(--border)] font-mono">📎 ${em.attachment}</span></div>` : ''}
        </div>
      `).join('');
      document.getElementById('email-drawer').classList.remove('hidden');
    }

    function closeEmailDrawer() {
      document.getElementById('email-drawer').classList.add('hidden');
    }

    // Initial render
    render();
  </script>
</body>
</html>
